{% extends 'base.html' %}
{% load form_tags %}
{% block title %}{{ action }} employee{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ action }} employee</h1>
</div>

<div class="card erp-form-shell">
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {% url 'hr:employee_list' as cancel_url %}
            {% render_form form cancel_url=cancel_url %}
        </form>
    </div>
</div>
{% endblock %}
