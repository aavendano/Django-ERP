{% extends 'base.html' %}
{% load form_tags %}
{% block title %}{{action}} Route - Django ERP{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="fas fa-edit"></i> {{action}} Route</h1>
</div>

<div class="card erp-form-shell">
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {% url 'logistics:route_list' as cancel_url %}
            {% render_form form cancel_url=cancel_url %}
        </form>
    </div>
</div>
{% endblock %}
